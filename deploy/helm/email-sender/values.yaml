replicaCount: 2

image:
  repository: email-sender
  # Если пусто, берётся appVersion чарта.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Отдельная идентичность для пода, чтобы источник SMTP-учётных данных
  # (привязка роли Vault, хранилище external-secrets) можно было ограничить этой нагрузкой.
  create: true
  name: ""
  annotations: {}

# Сюда - аннотации инжектора Vault Agent / Vault Secrets Operator.
podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  # Выводится как nginx.ingress.kubernetes.io/proxy-body-size (по умолчанию в ingress-nginx
  # это 1m, и большинство вложений получили бы 413 от nginx). Пустое значение берётся из
  # requestLimits.maxBodyMegabytes - самого большого тела, которое принимает сам API;
  # аннотация с тем же ключом в `annotations` имеет приоритет.
  proxyBodySize: ""
  annotations: {}
  hosts:
    - host: email-sender.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Память: пока JSON-запрос превращается в MIME-письмо, он хранится в памяти в нескольких
# копиях (буфер JSON, строка UTF-16, закодированное тело), так что закладывайте примерно
# 6x requestLimits.maxBodyMegabytes на каждую одновременную большую JSON-отправку:
# 30 MiB x 6 = ~180 MiB. Multipart-загрузки памяти почти не стоят - файлы больше 64 КБ
# буферизуются в /tmp и оттуда потоком проходят проверку размера и уходят в сеть. 512Mi
# покрывают базовые ~100 MiB рантайма плюс две худшие JSON-отправки одновременно;
# увеличивайте вместе с maxBodyMegabytes.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

requestLimits:
  # Максимальный размер тела JSON-запроса, принимаемый API. Релей принимает не больше
  # smtp.maxMessageBytes, а кодирование текст только увеличивает, так что большее тело
  # отправить всё равно нельзя. У multipart-действия свой фиксированный лимит 25 MiB.
  # Лимит тела на ingress задаётся отдельно (ingress.proxyBodySize).
  maxBodyMegabytes: 30

# /tmp - это emptyDir (корневая ФС только для чтения). ASP.NET Core буферизует туда каждый
# загруженный файл больше 64 КБ на время запроса, до 25 MiB на multipart-запрос, так что
# 256Mi вмещают около десяти одновременных загрузок максимального размера. Превышение
# sizeLimit приводит к вытеснению пода, а не к ошибке одной записи, отсюда и запас;
# масштабируйте вместе с конкурентностью.
tmpVolume:
  sizeLimit: 256Mi

# Лимиты на файлы в одном письме; проверяются с ответом 400 до сборки письма. В base64 байты
# вырастают в ~1.37 раза, так что 20 MiB в сумме дают ~28.7 МБ из 30 000 000 байт письма.
attachments:
  maxCount: 10
  maxTotalBytes: 20971520
  maxFileBytes: 20971520
  # Пустое значение оставляет встроенный список: .pdf .doc .docx .xls .xlsx .odt .ods .txt
  # .csv .png .jpg .jpeg .zip. Заданный здесь список полностью его заменяет.
  allowedExtensions: []

# Только настройки транспорта - не кладите сюда пароль, он попадёт в ConfigMap.
smtp:
  host: smtp.example.com
  port: 587
  # None | Auto | SslOnConnect | StartTls | StartTlsWhenAvailable
  security: StartTls
  fromAddress: noreply@example.com
  fromDisplayName: Notifications
  timeoutSeconds: 30
  acceptInvalidCertificates: false
  # Лимит размера письма на релее (его SIZE). Письмо измеряется полностью закодированным до
  # подключения; слишком большое отклоняется с 413, а не возвращается релеем как 502.
  maxMessageBytes: 30000000
  # Задавайте, только если в Secret с учётными данными нет ключа имени пользователя.
  userName: ""
  # Учётные данные читаются из существующего Secret, который этот чарт никогда не создаёт, -
  # заполняйте его тем способом, каким уже управляете секретами (инжектор Vault Agent,
  # Vault Secrets Operator, external-secrets). Оставьте name пустым, если релею не нужна
  # аутентификация.
  credentialsSecret:
    name: ""
    # Ключи внутри этого Secret. Оставьте userNameKey пустым, чтобы использовать smtp.userName выше.
    userNameKey: username
    passwordKey: password

# Вызывающие стороны - другие сервисы с токеном Keycloak, полученным по client credentials;
# этот сервис только проверяет его, поэтому ни client secret, ни redirect URI здесь не нужны.
keycloak:
  authority: https://keycloak.example.com/realms/corp
  audience: email-sender
  # Keycloak не включает клиента в `aud`, если у вызывающего клиента нет audience mapper.
  # Добавьте этот mapper или установите здесь false.
  validateAudience: true
  requireHttpsMetadata: true
  # Роль realm (или роль клиента, если задан rolesClientId), которая должна быть у сервисного аккаунта вызывающего.
  requiredRole: email-sender
  rolesClientId: email-sender

swagger:
  enabled: true

# Дополнительные переменные окружения, например Logging__LogLevel__Default.
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
