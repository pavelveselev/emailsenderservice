replicaCount: 2

image:
  repository: email-sender
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Give the pod its own identity, so whatever supplies the SMTP credentials
  # (a Vault role binding, an external-secrets store) can be scoped to this workload.
  create: true
  name: ""
  annotations: {}

# Vault Agent / Vault Secrets Operator injector annotations go here.
podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: email-sender.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Transport settings only - do not put a password here, it would land in the ConfigMap.
smtp:
  host: smtp.example.com
  port: 587
  # None | Auto | SslOnConnect | StartTls | StartTlsWhenAvailable
  security: StartTls
  fromAddress: noreply@example.com
  fromDisplayName: Notifications
  timeoutSeconds: 30
  acceptInvalidCertificates: false
  # Set only when the credentials Secret carries no user name key.
  userName: ""
  # Credentials are read from an existing Secret that this chart never creates - fill it
  # however you already manage secrets (Vault Agent injector, Vault Secrets Operator,
  # external-secrets). Leave name empty for a relay that needs no authentication.
  credentialsSecret:
    name: ""
    # Keys within that Secret. Leave userNameKey empty to keep smtp.userName above.
    userNameKey: username
    passwordKey: password

# Callers are other services presenting a Keycloak client-credentials token; this service
# only validates it, so no client secret or redirect URI is needed here.
keycloak:
  authority: https://keycloak.example.com/realms/corp
  audience: email-sender
  # Keycloak omits the client from `aud` unless the calling client has an audience mapper.
  # Add that mapper, or set this to false.
  validateAudience: true
  requireHttpsMetadata: true
  # Realm role (or client role, when rolesClientId is set) the calling service account must hold.
  requiredRole: email-sender
  rolesClientId: email-sender

swagger:
  enabled: true

# Extra environment variables, e.g. Logging__LogLevel__Default.
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
