replicaCount: 2

image:
  repository: email-sender
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Give the pod its own identity, so whatever supplies the SMTP credentials
  # (a Vault role binding, an external-secrets store) can be scoped to this workload.
  create: true
  name: ""
  annotations: {}

# Vault Agent / Vault Secrets Operator injector annotations go here.
podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  # Rendered as nginx.ingress.kubernetes.io/proxy-body-size (ingress-nginx defaults to 1m,
  # which would turn most attachments into a 413 from nginx). Empty derives it from
  # requestLimits.maxBodyMegabytes, the largest body the API itself accepts; an annotation
  # with the same key under `annotations` takes precedence.
  proxyBodySize: ""
  annotations: {}
  hosts:
    - host: email-sender.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Memory: a JSON request is held in memory several times over while it is turned into a
# MIME message (JSON buffer, UTF-16 string, encoded body), so budget roughly 6x
# requestLimits.maxBodyMegabytes per concurrent large JSON send: 30 MiB x 6 = ~180 MiB.
# Multipart uploads cost little memory - files over 64 KB are buffered to /tmp and streamed
# from there through the size check and onto the wire. 512Mi covers a ~100 MiB runtime
# baseline plus two worst-case JSON sends at once; raise it with maxBodyMegabytes.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

requestLimits:
  # Largest JSON request body the API accepts. The relay takes at most smtp.maxMessageBytes
  # and encoding only grows text, so a larger body could never be sent. The multipart action
  # has its own fixed 25 MiB cap. An ingress body limit applies separately (ingress.proxyBodySize).
  maxBodyMegabytes: 30

# /tmp is an emptyDir (the root filesystem is read-only). ASP.NET Core buffers every uploaded
# file over 64 KB there for the life of the request, up to 25 MiB per multipart request, so
# 256Mi holds about ten maximum-size uploads in flight. Exceeding sizeLimit gets the pod
# evicted rather than failing one write, hence the headroom; scale it with concurrency.
tmpVolume:
  sizeLimit: 256Mi

# Per-message file limits, enforced with a 400 before anything is built. Raw bytes grow by
# ~1.37x as base64, so the 20 MiB total becomes ~28.7 MB of a 30,000,000-byte message.
attachments:
  maxCount: 10
  maxTotalBytes: 20971520
  maxFileBytes: 20971520
  # Empty keeps the built-in list: .pdf .doc .docx .xls .xlsx .odt .ods .txt .csv .png .jpg
  # .jpeg .zip. A list here replaces it entirely.
  allowedExtensions: []

# Transport settings only - do not put a password here, it would land in the ConfigMap.
smtp:
  host: smtp.example.com
  port: 587
  # None | Auto | SslOnConnect | StartTls | StartTlsWhenAvailable
  security: StartTls
  fromAddress: noreply@example.com
  fromDisplayName: Notifications
  timeoutSeconds: 30
  acceptInvalidCertificates: false
  # The relay's message size limit (its SIZE). Messages are measured fully encoded before
  # connecting; a larger one is refused with 413 instead of being bounced by the relay as 502.
  maxMessageBytes: 30000000
  # Set only when the credentials Secret carries no user name key.
  userName: ""
  # Credentials are read from an existing Secret that this chart never creates - fill it
  # however you already manage secrets (Vault Agent injector, Vault Secrets Operator,
  # external-secrets). Leave name empty for a relay that needs no authentication.
  credentialsSecret:
    name: ""
    # Keys within that Secret. Leave userNameKey empty to keep smtp.userName above.
    userNameKey: username
    passwordKey: password

# Callers are other services presenting a Keycloak client-credentials token; this service
# only validates it, so no client secret or redirect URI is needed here.
keycloak:
  authority: https://keycloak.example.com/realms/corp
  audience: email-sender
  # Keycloak omits the client from `aud` unless the calling client has an audience mapper.
  # Add that mapper, or set this to false.
  validateAudience: true
  requireHttpsMetadata: true
  # Realm role (or client role, when rolesClientId is set) the calling service account must hold.
  requiredRole: email-sender
  rolesClientId: email-sender

swagger:
  enabled: true

# Extra environment variables, e.g. Logging__LogLevel__Default.
extraEnv: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
