{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "email-sender.fullname" . }}
  labels:
    {{- include "email-sender.labels" . | nindent 4 }}
  {{- /* Лимит тела должен пропускать всё, что принимает API; в ingress-nginx по умолчанию 1m. */}}
  {{- $bodySize := .Values.ingress.proxyBodySize | default (printf "%dm" (int .Values.requestLimits.maxBodyMegabytes)) }}
  {{- $annotations := merge (deepCopy (.Values.ingress.annotations | default dict)) (dict "nginx.ingress.kubernetes.io/proxy-body-size" $bodySize) }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "email-sender.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
