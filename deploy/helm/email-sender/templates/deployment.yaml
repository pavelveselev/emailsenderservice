apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "email-sender.fullname" . }}
  labels:
    {{- include "email-sender.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "email-sender.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Перезапускать поды при изменении конфигурации; без этого helm upgrade, меняющий только
        # ConfigMap, оставляет в работающих контейнерах старые значения.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "email-sender.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "email-sender.serviceAccountName" . }}
      # Оставлен смонтированным, чтобы внутрикластерный инжектор секретов мог аутентифицироваться от имени этой нагрузки.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "email-sender.fullname" . }}
          env:
            # Учётные данные - переменными окружения из Secret, которым чарт не владеет; запись в
            # `env` важнее того же ключа из `envFrom`, поэтому она побеждает ConfigMap.
            {{- with .Values.smtp.credentialsSecret }}
            {{- if .name }}
            {{- with .userNameKey }}
            - name: Smtp__UserName
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.smtp.credentialsSecret.name }}
                  key: {{ . }}
            {{- end }}
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
          readinessProbe:
            # Сообщает unhealthy, пока нет обязательной конфигурации или Secret с учётными
            # данными, - так неверно настроенный под остаётся вне Service, а не проваливает
            # отправки.
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem включён, а фреймворку всё равно нужно куда-то писать -
            # в том числе загруженные вложения, которые буферизуются здесь на время запроса.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          {{- with .Values.tmpVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
