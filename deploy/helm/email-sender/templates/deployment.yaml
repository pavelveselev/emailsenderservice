apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "email-sender.fullname" . }}
  labels:
    {{- include "email-sender.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "email-sender.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when configuration changes; without this a helm upgrade that only
        # touches the ConfigMap leaves the old values live in the running containers.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "email-sender.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "email-sender.serviceAccountName" . }}
      # Left mounted so an in-cluster secrets injector can authenticate as this workload.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "email-sender.fullname" . }}
          env:
            # Credentials as env vars from a Secret the chart does not own; an `env` entry
            # outranks the same key coming from `envFrom`, so this wins over the ConfigMap.
            {{- with .Values.smtp.credentialsSecret }}
            {{- if .name }}
            {{- with .userNameKey }}
            - name: Smtp__UserName
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.smtp.credentialsSecret.name }}
                  key: {{ . }}
            {{- end }}
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .passwordKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 10
          readinessProbe:
            # Reports unhealthy while required configuration or the credential Secret is
            # missing, which keeps a misconfigured pod out of the Service rather than
            # failing sends.
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the framework still needs somewhere to write.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
